{% comment %}
Counter Panel Template - goals in review. Goals are approved by default; the
counter right-clicks one on the board to put it in review (counter.js).
{% endcomment %}

<div class="panel panel-default fill-parent">
    <div class="panel-heading">
        In Review
    </div>
    <div class="panel-body panel-body-overflow-container">
        <div id="counter-panel">
            <div class="counter-body panel-inner">
                <div id="pending-claims-list"></div>
                <div class="counter-history-divider"></div>
                <div class="counter-history-header">History</div>
                <div id="claim-history-list"></div>
            </div>
        </div>
    </div>
</div>

<div id="additional-settings" class="panel panel-default fill-parent">
    <div class="panel-heading">
        <span>
            Additional Settings
        </span>
        <span id="additional-settings-collapse" class="btn btn-default btn-xs pull-right collapse-button">
            -
        </span>
    </div>
    <div class="panel-body">
        <div>
            <div class="checkbox m-b-s" style="margin-top: 0">
                <label><input id="fullwidth-toggle" type="checkbox"> Full Width Board</label>
            </div>
            <div class="checkbox" style="margin-bottom: 0">
                <label><input id="blackoutview-toggle" type="checkbox"> Solo Blackout View</label>
            </div>
            <hr class="m-t-s m-b-s">
            {% if obs_selected is not None and user.is_authenticated %}
            <div class="checkbox m-b-s" style="margin-top: 0">
                <label title="Your OBS link shows the board of one room. Tick this to make it this one.">
                    <input id="obs-room-toggle" type="checkbox" data-room="{{ room.encoded_uuid }}"{% if obs_selected %} checked{% endif %}>
                    Use this board as my OBS source
                </label>
            </div>
            {% endif %}
            <button type="button" id="obs-regenerate" class="btn btn-default btn-xs"
                    title="Makes a new OBS link and stops the old one working. Update your OBS browser source afterwards.">
                Regenerate OBS link
            </button>
        </div>
    </div>
</div>

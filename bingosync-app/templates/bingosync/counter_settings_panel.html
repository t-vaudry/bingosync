{% comment %}
Counter Settings: the counter's review style, the same preference as on
their profile. Changing it saves it and applies at once (counter.js).
{% endcomment %}
<div id="counter-settings" class="panel panel-default">
    <div class="panel-heading">
        <span>
            Counter Settings
        </span>
        <span id="counter-settings-collapse" class="btn btn-default btn-xs pull-right collapse-button">
            -
        </span>
    </div>
    <div class="panel-body">
        <div class="counter-settings-help">
            Right-click a goal to put it in review, then:
        </div>
        {% for value, label in review_styles %}
            <div class="radio counter-settings-option">
                <label>
                    <input type="radio" name="review_style" value="{{ value }}"{% if review_style == value %} checked{% endif %}>
                    {{ label }}
                </label>
            </div>
        {% endfor %}
        <div id="counter-settings-status" class="counter-settings-status"></div>
    </div>
</div>

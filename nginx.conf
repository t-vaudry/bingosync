# Nginx Configuration for HP Bingo Platform
# Handles HTTP routing to Django and WebSocket routing to Tornado.
#
# TLS is terminated by the reverse proxy in front of this stack (e.g. Nginx
# Proxy Manager on Unraid), which forwards plain HTTP to this container.

events {
    worker_connections 1024;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Recover the real client address from the upstream proxy's
    # X-Forwarded-For. Requests arrive from a private address (the proxy on
    # the LAN or a Docker network); the first untrusted address walking back
    # through the header is the client. $remote_addr then holds that address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Keep the upstream proxy's X-Forwarded-Proto (https) so Django knows the
    # original request was secure; fall back to our own scheme when this
    # container is hit directly.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Look up the django/tornado containers through Docker's DNS at request
    # time. A static upstream is resolved once at startup, so recreating
    # django on an update (new IP) would leave nginx answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Client body size limit (for file uploads)
    client_max_body_size 10M;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Static files served by Nginx. Filenames are content-hashed by Django's
    # ManifestStaticFilesStorage, so they can be cached for a long time.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files served by Nginx
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket connections routed to Tornado
    location /websocket/ {
        # Variable upstream (see resolver above); strip the /websocket prefix
        set $tornado_upstream tornado:8888;
        rewrite ^/websocket(/.*)$ $1 break;
        proxy_pass http://$tornado_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket timeout (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # All other HTTP traffic routed to Django
    location / {
        # Variable upstream (see resolver above)
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

}

# Production stack. Runs behind a TLS-terminating reverse proxy such as
# Nginx Proxy Manager, which forwards https://DOMAIN to this host's HTTP_PORT.
# See DEPLOYMENT.md. Configure everything in .env (template: .env.example).

services:
  # Bundled PostgreSQL. Enabled by COMPOSE_PROFILES=bundled-db in .env; remove
  # that line and set DB_HOST to use an existing Postgres server instead.
  postgres:
    image: postgres:15-alpine
    container_name: bingosync-postgres
    profiles: ["bundled-db"]
    environment:
      POSTGRES_DB: ${DB_NAME:-bingosync}
      POSTGRES_USER: ${DB_USER:-bingosync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # A host folder (not a Docker volume), so the data survives the Docker
      # image being recreated and is included in appdata backups.
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
    networks:
      - bingosync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bingosync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bingosync-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bingosync-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Django Application
  django:
    build:
      context: ./bingosync-app
      dockerfile: Dockerfile
    container_name: bingosync-django
    environment:
      # Database: the bundled "postgres" service unless DB_HOST says otherwise
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-bingosync}
      DB_USER: ${DB_USER:-bingosync}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Django Settings
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      DEBUG: ${DEBUG:-0}
      STATIC_ROOT: /app/staticfiles

      # Internal API
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}

      # WebSocket: browsers connect to wss://DOMAIN/websocket/ (routed to
      # Tornado by nginx); Django publishes events to Tornado internally.
      SOCKETS_DOMAIN: ${DOMAIN}/websocket
      SOCKETS_PUBLISH_HOST: tornado:8888

      # Optional Settings
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}

      # Optional SMTP for password-reset emails. Without EMAIL_HOST, reset
      # links are written to this container's log instead.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - bingosync-network
    depends_on:
      postgres:
        condition: service_healthy
        # Not started when using your own database (profile disabled)
        required: false
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Tornado WebSocket Server
  tornado:
    build:
      context: ./bingosync-websocket
      dockerfile: Dockerfile
    container_name: bingosync-tornado
    command: python app.py
    environment:
      # Internal API
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}

      # WebSocket Settings
      DEBUG: ${DEBUG:-0}
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      DJANGO_INTERNAL_HOST: django:8000
    networks:
      - bingosync-network
    depends_on:
      - django
    restart: unless-stopped

  # Nginx: serves static files and routes /websocket/ to Tornado and
  # everything else to Django. Point your reverse proxy at HTTP_PORT.
  nginx:
    image: nginx:1.24-alpine
    container_name: bingosync-nginx
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      # Configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      # Static and media files
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    networks:
      - bingosync-network
    depends_on:
      - django
      - tornado
    restart: unless-stopped

# Persistent volumes for data storage
volumes:
  redis_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local

# Internal network for service communication
networks:
  bingosync-network:
    driver: bridge
